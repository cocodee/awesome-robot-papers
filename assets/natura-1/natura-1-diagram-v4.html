<script>
(function () {
  var wrap = document.getElementById('natura-1-diagram');
  var q = new URLSearchParams(location.search), page = document.body.hasAttribute('data-n1-page');
  var dark = wrap.getAttribute('data-theme') === 'dark' || (page && q.get('theme') === 'dark');
  var motion = !(wrap.getAttribute('data-motion') === 'off' || (page && q.get('motion') === 'off'));
  if (page && dark) document.documentElement.classList.add('n1-dark');

  // the drawing: all geometry is computed here, once per frame
  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.forceUpdate = function () { render(); };
class Component extends DCLogic {
  // everything that does not depend on where the present is, plus frame(now): the picture with the present at trajectory time `now` (0..1)
  make(seed) {
    // two streams of noise: one for the figure, one for the little pictures on the wall, so that either can change without disturbing the other
    const stream = (s) => { const rnd = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; return { rnd: rnd, gauss: () => { const u = Math.max(rnd(), 1e-9), v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307 * v); } }; };
    const noise = stream((seed | 0) || 1), rnd = noise.rnd, gauss = noise.gauss, pics = stream(((seed | 0) || 1) + 7919);
    const r1 = (n) => Math.round(n * 10) / 10, r2 = (n) => Math.round(n * 100) / 100, clamp = (v) => Math.max(0, Math.min(1, v));
    const pt = (p) => r1(p[0]) + ' ' + r1(p[1]);
    const line = (pts) => { let d = ''; for (let i = 0; i < pts.length; i++) d += (i ? 'L' : 'M') + pt(pts[i]); return d; };
    const dot = (p) => 'M' + pt(p) + 'h.01';
    const seg = (a, b) => 'M' + pt(a) + 'L' + pt(b);
    const ring = (c, r) => 'M' + r1(c[0] - r) + ' ' + r1(c[1]) + 'a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0';
    const rect = (x, y, w, h) => 'M' + r1(x) + ' ' + r1(y) + 'h' + w + 'v' + h + 'h' + (-w) + 'Z';
    const sq = (p, w) => rect(p[0] - w / 2, p[1] - w / 2, w, w);
    const tri = (p, d, w) => { const l = Math.hypot(d[0], d[1]) || 1, ux = d[0] / l, uy = d[1] / l; return line([[p[0] + ux * w * 1.2, p[1] + uy * w * 1.2], [p[0] - ux * w * 0.8 - uy * w, p[1] - uy * w * 0.8 + ux * w], [p[0] - ux * w * 0.8 + uy * w, p[1] - uy * w * 0.8 - ux * w]]) + 'Z'; };

    // oblique projection: X = time, Y = up (the wall), Z = toward the viewer (the floor)
    const OX = 142, OY = 560, ZX = 0.42, ZY = 0.5, WALL_W = 1380, WALL_H = 448, FLOOR_D = 340;
    const P = (x, y, z) => [OX + x + z * ZX, OY - y + z * ZY];
    const STEPS = 18, TAU = Math.PI * 2, HZ = 7 / 18, GRASP = 10;
    const X = (t) => 86.7 + 1215 * t;
    const Y = (t) => 190 + 70 * Math.sin(TAU * 1.15 * t + 0.6) + 28 * Math.sin(TAU * 2.7 * t + 1.9);
    const Z = (t) => 140 + 170 * t * t + 28 * Math.sin(TAU * 1.6 * t + 0.4);

      }
      Object.assign(g, R);
      const front = P(xn, 0, FLOOR_D);
      g.nowLine = seg(front, [front[0], front[1] + 10]) + seg([front[0], RY - 14], [front[0], AY]);

      // the two labels that ride on the present
      g.pastL = r1(OX + xn - 418); g.pastO = r2(clamp((now - 0.13) / 0.06));
      g.futL = r1(OX + xn + 18); g.futO = r2(clamp((0.94 - now) / 0.06));

}

  // a small binder: fills {{name}} attributes of the template from the values the drawing returns
  var HOLE = /\{\{\s*([\w.$]+)\s*\}\}/g, WHOLE = /^\{\{\s*([\w.$]+)\s*\}\}$/;

      var b = list[i], v = b.key ? look(scope, b.key) : b.tpl.replace(HOLE, function (_, p) { var x = look(scope, p); return x == null ? '' : x; });

  function render() {

    apply(binds, vals);
    loops.forEach(function (L) {

        var it = { nodes: [], binds: [] };
        L.parts.forEach(function (p) { var n = p.cloneNode(true); collect(n, it.binds); L.mark.parentNode.insertBefore(n, L.mark); it.nodes.push(n); });
        L.items.push(it);
      }
      while (L.items.length > list.length) L.items.pop().nodes.forEach(function (n) { n.parentNode.removeChild(n); });

  wrap.appendChild(root);
  var stage = wrap.querySelector('.n1');
