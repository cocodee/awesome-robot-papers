<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Natura-1 Scaling Validation</title>
<style>
/* Natura-1 scaling figure. Same tokens as the benchmark figure; scoped under .nb.
   To match your blog, change the tokens in this first rule. */
.nb{
  --nb-bg:#fcfcfc;            /* page background */
  --nb-ink:#25272a;           /* primary text */
  --nb-ink2:#636465;          /* secondary text */
  --nb-ink3:#858687;          /* axis ticks */
  --nb-rule:#e8e8e7;          /* dividers */
  --nb-grid:#f0f0ef;          /* gridlines */
  --nb-axis:#d1d2d2;          /* baseline */
  --nb-band:#eeeeed;          /* section band */
  --nb-line:#3a3d41;          /* measured line and points (Natura-1 graphite) */
  --nb-fit:#9a9c9e;           /* power-law fit */
  --nb-serif:Georgia,"Times New Roman","Songti SC",serif;
  --nb-sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Noto Sans CJK SC",sans-serif;
  container-type:inline-size;
  margin:0;
  background:var(--nb-bg);
  color:var(--nb-ink);
  font:13px/1.5 var(--nb-sans);
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
html,body{margin:0;background:#fcfcfc}
main{max-width:980px;margin:0 auto;padding:32px 24px 40px}
.nb *{box-sizing:border-box}
.nb h3,.nb h4,.nb h5,.nb p,.nb dl,.nb dd{margin:0}

.nb-head h3{font:400 29px/1.15 var(--nb-serif);letter-spacing:-.5px}
.nb-head p{margin-top:11px;max-width:70ch;font-size:13.5px;line-height:1.65;color:var(--nb-ink2)}

/* key */
.sc-key{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:22px;padding:13px 0;border-top:1px solid var(--nb-rule);border-bottom:1px solid var(--nb-rule)}
.sc-k{display:inline-flex;align-items:center;gap:9px;font-size:12px;line-height:1.3;color:var(--nb-ink2)}
.sc-k i{position:relative;display:block;flex:none;width:26px;height:0}
.sc-k-line{border-top:2px solid var(--nb-line)}
.sc-k-line::after{content:"";position:absolute;left:50%;top:-1px;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--nb-line);box-shadow:0 0 0 1.5px var(--nb-bg)}
.sc-k-fit{border-top:1.5px dashed var(--nb-fit)}

/* cohorts */
.sc-cohort{margin-top:26px}
.sc-band{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:3px 18px;padding:8px 12px;background:var(--nb-band);border-radius:3px}
.sc-band h4{font:600 13px/1.3 var(--nb-sans);color:var(--nb-ink)}
.sc-band span{font-size:11.5px;line-height:1.3;color:var(--nb-ink2)}
.sc-panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 44px;margin-top:22px}

/* one panel */
.sc-panel{position:relative;min-width:0;container-type:inline-size}
.sc-ph{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.sc-ph h5{font:400 19px/1.2 var(--nb-serif);letter-spacing:-.3px}
.sc-ph p{margin-top:5px;font-size:11.5px;line-height:1.4;color:var(--nb-ink2)}
.sc-eq{text-align:right;white-space:nowrap}
.sc-eq span{display:block;font-size:13px;line-height:1.3;font-weight:600;color:var(--nb-ink)}
.sc-eq sup{font-size:.74em;line-height:0;vertical-align:.5em}
.sc-eq small{display:block;margin-top:4px;font-size:11px;line-height:1.3;color:var(--nb-ink3)}

/* square plot: the two axes have the same length at every width */
.sc-plot{position:relative;aspect-ratio:1/1;margin:26px 20px 0 46px;border-bottom:1px solid var(--nb-axis)}
.sc-gy{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--nb-grid)}
.sc-gy span{position:absolute;right:100%;top:0;transform:translateY(-50%);padding-right:10px;font-style:normal;font-size:10.5px;line-height:1;color:var(--nb-ink3);white-space:nowrap}
.sc-gx{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--nb-grid)}
.sc-gx span{position:absolute;top:100%;left:0;transform:translateX(-50%);padding-top:9px;font-style:normal;font-size:10.5px;line-height:1;color:var(--nb-ink3);white-space:nowrap}
.sc-lines{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.sc-fit{fill:none;stroke:var(--nb-fit);stroke-width:1.5;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.sc-line{fill:none;stroke:var(--nb-line);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}

/* the curves fall to the right, so the free space is above-right and below-left of each point */
.sc-lab{position:absolute;transform:translate(-5px,calc(-100% - 8px));font-size:10.5px;line-height:1;color:var(--nb-ink2);white-space:nowrap;pointer-events:none;
  text-shadow:0 0 3px var(--nb-bg),0 0 3px var(--nb-bg),1px 0 0 var(--nb-bg),-1px 0 0 var(--nb-bg),0 1px 0 var(--nb-bg),0 -1px 0 var(--nb-bg)}
.sc-lab.below{transform:translate(calc(-100% + 5px),9px)}
.sc-lab.end{font-size:11.5px;font-weight:600;color:var(--nb-ink)}
/* the last label is centred over its point, in the right margin */
.sc-lab.last{transform:translate(-50%,calc(-100% - 9px))}
.sc-lab.last.below{transform:translate(-50%,10px)}

.sc-pt{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;padding:0;border:0;border-radius:50%;background:none;cursor:crosshair;-webkit-tap-highlight-color:transparent}
.sc-pt::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--nb-line);box-shadow:0 0 0 2px var(--nb-bg)}
.sc-pt:focus{outline:none}
.sc-pt.is-active::after,.sc-pt:focus-visible::after{box-shadow:0 0 0 2px var(--nb-bg),0 0 0 5.5px rgba(58,61,65,.2)}

.sc-xt{margin:30px 20px 0 46px !important;text-align:center;font-size:11px;line-height:1.3;color:var(--nb-ink3)}

.sc-tip{position:absolute;z-index:5;width:212px;max-width:calc(100% - 8px);padding:11px 13px;background:#fff;border:1px solid var(--nb-rule);border-radius:6px;
  box-shadow:0 6px 20px -6px rgba(20,20,20,.22);pointer-events:none}
.sc-tip[hidden]{display:none}
.sc-tip-t{display:block;margin-bottom:8px;font-size:11px;line-height:1.4;color:var(--nb-ink2)}
.sc-tip dl{display:grid;gap:5px;font-size:11.5px;line-height:1.4}
.sc-tip dl>div{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sc-tip dt{color:var(--nb-ink2)}
.sc-tip dd{font-weight:600;color:var(--nb-ink);white-space:nowrap}

/* small panels: keep the first and last value labels, the rest are in the tooltip */
@container (max-width:400px){
  .sc-lab.mid{display:none}
  .sc-ph{flex-direction:column;gap:10px}
  .sc-eq{text-align:left}
  .sc-plot{margin-left:42px;margin-right:34px}
  /* points sit closer together here: the last label starts at its point and runs into the right margin */
  .sc-lab.last{transform:translate(-5px,calc(-100% - 8px))}
  .sc-lab.last.below{transform:translate(-5px,9px)}
  .sc-xt{margin-left:42px !important;margin-right:34px !important}
}
@container (max-width:1020px){.sc-panels{gap:30px 28px}}
@container (max-width:560px){
  .nb-head h3{font-size:25px}
  .sc-panels{grid-template-columns:minmax(0,1fr);gap:34px}
}
@media (max-width:640px){main{padding:20px 16px 28px}}
@media print{html,body{background:#fff}.nb{--nb-bg:#fff}main{padding:0;max-width:none}.sc-cohort{break-inside:avoid}.sc-tip{display:none !important}}

</style>
</head>

<script>
document.querySelectorAll('.sc-panel').forEach(function (panel) {
  var tip = panel.querySelector('.sc-tip'), pts = [].slice.call(panel.querySelectorAll('.sc-pt')), active = null;
  function place() {
    if (!active) return;
    var b = panel.getBoundingClientRect(), d = active.getBoundingClientRect(), c = (d.left + d.right) / 2 - b.left;
    var left = Math.max(4, Math.min(c - tip.offsetWidth / 2, b.width - tip.offsetWidth - 4));
    var above = d.top - b.top - tip.offsetHeight - 4;
    tip.style.left = left + 'px';
    tip.style.top = (above >= 0 ? above : d.bottom - b.top + 4) + 'px';
  }
  function hide() { if (active) active.classList.remove('is-active'); active = null; tip.hidden = true; }
  function show(p) {
    if (active) active.classList.remove('is-active');
    active = p; p.classList.add('is-active');
    tip.querySelector('[data-h]').textContent = p.dataset.hoursLabel;
    tip.querySelector('[data-v]').textContent = Number(p.dataset.value).toFixed(6);
    tip.hidden = false; place();
  }
  pts.forEach(function (p, i) {
    p.addEventListener('pointerenter', function () { show(p); });
    p.addEventListener('pointerleave', function (e) { if (e.pointerType !== 'touch') hide(); });
    p.addEventListener('focus', function () { show(p); });
    p.addEventListener('blur', hide);
    p.addEventListener('click', function () { show(p); });
    p.addEventListener('keydown', function (e) {
      var t;
      if (e.key === 'ArrowRight') t = Math.min(i + 1, pts.length - 1);
      if (e.key === 'ArrowLeft') t = Math.max(i - 1, 0);
      if (e.key === 'Home') t = 0;
      if (e.key === 'End') t = pts.length - 1;
      if (t !== undefined) { e.preventDefault(); pts[t].focus({preventScroll: true}); }
      else if (e.key === 'Escape') { e.preventDefault(); hide(); }
    });
  });
  document.addEventListener('pointerdown', function (e) {
    if (!panel.contains(e.target) || !e.target.closest('.sc-pt')) hide();
  });
  if (window.ResizeObserver) new ResizeObserver(place).observe(panel);
});
</script>
