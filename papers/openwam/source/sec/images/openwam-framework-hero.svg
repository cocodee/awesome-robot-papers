<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1054" role="img" aria-labelledby="title desc">
  <title id="title">Unified World-Action Modeling interaction programs</title>
  <desc id="desc">A stylized hero diagram showing video and action streams connected by interaction programs and Generalist Joint Denoising.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="0.38" stop-color="#edf3fb"/>
      <stop offset="0.72" stop-color="#f6f0e4"/>
      <stop offset="1" stop-color="#edf6ef"/>
    </linearGradient>
    <radialGradient id="videoGlow" cx="0.2" cy="0.25" r="0.58">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="actionGlow" cx="0.82" cy="0.44" r="0.58">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gjdGlow" cx="0.5" cy="0.75" r="0.52">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="greenBlock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="laneFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf2" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#f7fbff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#f1fbf8" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="gjdLaneFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3df" stop-opacity="0.98"/>
      <stop offset="0.52" stop-color="#fffaf2" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#fff0db" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="recipeFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff7e8" stop-opacity="0.96"/>
      <stop offset="0.54" stop-color="#f8f4ef" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#eff8f3" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17213a" flood-opacity="0.15"/>
    </filter>
    <filter id="laneShadow" x="-12%" y="-40%" width="124%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17213a" flood-opacity="0.12"/>
    </filter>
    <filter id="blueSoft">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#38bdf8" flood-opacity="0.38"/>
    </filter>
    <filter id="greenSoft">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2dd4bf" flood-opacity="0.38"/>
    </filter>
    <marker id="arrowBlue" markerWidth="18" markerHeight="18" refX="15.5" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.8 L17,9 L1.5,16.2 Z" fill="#2e63d7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="18" markerHeight="18" refX="15.5" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.8 L17,9 L1.5,16.2 Z" fill="#178a7c"/>
    </marker>
    <marker id="arrowPurpleRight" markerWidth="18" markerHeight="18" refX="15.5" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.8 L17,9 L1.5,16.2 Z" fill="#654bb5"/>
    </marker>
    <marker id="arrowPurpleLeft" markerWidth="18" markerHeight="18" refX="15.5" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.8 L17,9 L1.5,16.2 Z" fill="#654bb5"/>
    </marker>
    <marker id="arrowOrangeRight" markerWidth="18" markerHeight="18" refX="15.5" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.8 L17,9 L1.5,16.2 Z" fill="#ef8619"/>
    </marker>
    <marker id="arrowOrangeLeft" markerWidth="18" markerHeight="18" refX="15.5" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,1.8 L17,9 L1.5,16.2 Z" fill="#ef8619"/>
    </marker>
  </defs>

  <rect width="2048" height="1054" fill="url(#bg)"/>
  <rect width="2048" height="1054" fill="url(#videoGlow)"/>
  <rect width="2048" height="1054" fill="url(#actionGlow)"/>
  <rect width="2048" height="1054" fill="url(#gjdGlow)"/>
  <g opacity="0.18" stroke="#9aa7bd" stroke-width="1">
    <path d="M0 145 H2048"/>
    <path d="M0 337 H2048"/>
    <path d="M0 529 H2048"/>
    <path d="M0 721 H2048"/>
    <path d="M264 0 V1054"/>
    <path d="M760 0 V1054"/>
    <path d="M1288 0 V1054"/>
    <path d="M1784 0 V1054"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="1024" y="58" text-anchor="middle" font-size="45" font-weight="650" fill="#263247">Unified World-Action Modeling</text>
    <text x="1024" y="106" text-anchor="middle" font-size="31" font-weight="850" fill="#6750b8">Interaction programs</text>
    <line x1="548" y1="92" x2="722" y2="92" stroke="#9ca3af" stroke-width="3" opacity="0.58"/>
    <line x1="1326" y1="92" x2="1500" y2="92" stroke="#9ca3af" stroke-width="3" opacity="0.58"/>

    <!-- Video stream panel -->
    <g filter="url(#panelShadow)">
      <rect x="36" y="30" width="477" height="795" rx="28" fill="#fffaf2" fill-opacity="0.72" stroke="#8dbcf4" stroke-width="4"/>
      <rect x="49" y="43" width="451" height="769" rx="22" fill="#ffffff" fill-opacity="0.28" stroke="#ffffff" stroke-opacity="0.78" stroke-width="2"/>
    </g>
    <g transform="translate(221 68)">
      <rect x="0" y="0" width="108" height="72" rx="13" fill="#e8f1ff" stroke="#2e63d7" stroke-width="5" filter="url(#blueSoft)"/>
      <path d="M38 20 L75 36 L38 52 Z" fill="#2e63d7"/>
    </g>
    <text x="274" y="187" text-anchor="middle" font-size="31" fill="#17213a">Video input</text>
    <g transform="translate(82 233)">
      <rect x="0" y="0" width="386" height="82" rx="14" fill="#e8f1ff" fill-opacity="0.82" stroke="#bfd7f7" stroke-width="3"/>
      <rect x="0" y="93" width="386" height="82" rx="14" fill="#e8f1ff" fill-opacity="0.82" stroke="#bfd7f7" stroke-width="3"/>
      <rect x="0" y="325" width="386" height="82" rx="14" fill="#e8f1ff" fill-opacity="0.82" stroke="#bfd7f7" stroke-width="3"/>
      <rect x="0" y="418" width="386" height="82" rx="14" fill="#e8f1ff" fill-opacity="0.82" stroke="#bfd7f7" stroke-width="3"/>
      <text x="193" y="50" text-anchor="middle" font-size="31" fill="#3c98f0">...</text>
      <text x="193" y="143" text-anchor="middle" font-size="31" fill="#3c98f0">...</text>
      <text x="193" y="375" text-anchor="middle" font-size="31" fill="#3c98f0">...</text>
      <text x="193" y="468" text-anchor="middle" font-size="31" fill="#3c98f0">...</text>
      <rect x="0" y="185" width="386" height="124" rx="22" fill="url(#blueBlock)" stroke="#7dd3fc" stroke-width="5" filter="url(#blueSoft)"/>
      <text x="193" y="263" text-anchor="middle" font-size="34" font-weight="850" fill="#ffffff">MoT block</text>
    </g>
    <text x="275" y="788" text-anchor="middle" font-size="38" font-weight="850" fill="#2e63d7">Video stream</text>

    <!-- Action stream panel -->
    <g filter="url(#panelShadow)">
      <rect x="1524" y="30" width="475" height="795" rx="28" fill="#fbfff8" fill-opacity="0.72" stroke="#86d5cb" stroke-width="4"/>
      <rect x="1537" y="43" width="449" height="769" rx="22" fill="#ffffff" fill-opacity="0.28" stroke="#ffffff" stroke-opacity="0.78" stroke-width="2"/>
    </g>
    <g transform="translate(1706 47)" stroke="#16978d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#greenSoft)">
      <line x1="28" y1="76" x2="28" y2="38"/>
      <line x1="28" y1="38" x2="65" y2="10"/>
      <line x1="65" y1="10" x2="102" y2="31"/>
      <rect x="6" y="76" width="44" height="10" rx="2" fill="#16978d" stroke="none"/>
      <circle cx="28" cy="38" r="10" fill="#ffffff"/>
      <circle cx="65" cy="10" r="10" fill="#ffffff"/>
      <circle cx="102" cy="31" r="10" fill="#ffffff"/>
    </g>
    <path d="M1810 72 C1825 63, 1838 67, 1847 78" fill="none" stroke="#16978d" stroke-width="5" stroke-linecap="round"/>
    <text x="1762" y="187" text-anchor="middle" font-size="31" fill="#17213a">Action input</text>
    <g transform="translate(1568 233)">
      <rect x="0" y="0" width="388" height="82" rx="14" fill="#e3f4f1" fill-opacity="0.82" stroke="#afdcd6" stroke-width="3"/>
      <rect x="0" y="93" width="388" height="82" rx="14" fill="#e3f4f1" fill-opacity="0.82" stroke="#afdcd6" stroke-width="3"/>
      <rect x="0" y="325" width="388" height="82" rx="14" fill="#e3f4f1" fill-opacity="0.82" stroke="#afdcd6" stroke-width="3"/>
      <rect x="0" y="418" width="388" height="82" rx="14" fill="#e3f4f1" fill-opacity="0.82" stroke="#afdcd6" stroke-width="3"/>
      <text x="194" y="50" text-anchor="middle" font-size="31" fill="#87d741">...</text>
      <text x="194" y="143" text-anchor="middle" font-size="31" fill="#87d741">...</text>
      <text x="194" y="375" text-anchor="middle" font-size="31" fill="#87d741">...</text>
      <text x="194" y="468" text-anchor="middle" font-size="31" fill="#87d741">...</text>
      <rect x="0" y="185" width="388" height="124" rx="22" fill="url(#greenBlock)" stroke="#99f6e4" stroke-width="5" filter="url(#greenSoft)"/>
      <text x="194" y="263" text-anchor="middle" font-size="34" font-weight="850" fill="#ffffff">MoT block</text>
    </g>
    <text x="1762" y="788" text-anchor="middle" font-size="38" font-weight="850" fill="#178a7c">Action stream</text>

    <!-- Interaction programs -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="780" fill="#17213a">
      <g transform="translate(549 149)" filter="url(#laneShadow)">
        <rect x="0" y="0" width="895" height="80" rx="14" fill="url(#laneFill)" stroke="#d8d2c7" stroke-width="3"/>
        <circle cx="126" cy="40" r="9" fill="#2e63d7"/>
        <circle cx="849" cy="40" r="9" fill="#178a7c"/>
        <path d="M160 40 L244 40" stroke="#2e63d7" stroke-width="5.2" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
        <path d="M731 40 L815 40" stroke="#2e63d7" stroke-width="5.2" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
        <text x="448" y="51" text-anchor="middle" font-size="30">video to action</text>
      </g>
      <g transform="translate(549 243)" filter="url(#laneShadow)">
        <rect x="0" y="0" width="895" height="80" rx="14" fill="url(#laneFill)" stroke="#d8d2c7" stroke-width="3"/>
        <circle cx="126" cy="40" r="9" fill="#2e63d7"/>
        <circle cx="849" cy="40" r="9" fill="#178a7c"/>
        <path d="M244 40 L160 40" stroke="#178a7c" stroke-width="5.2" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
        <path d="M815 40 L731 40" stroke="#178a7c" stroke-width="5.2" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
        <text x="448" y="51" text-anchor="middle" font-size="30">action to video</text>
      </g>
      <g transform="translate(549 337)" filter="url(#laneShadow)">
        <rect x="0" y="0" width="895" height="80" rx="14" fill="url(#laneFill)" stroke="#d8d2c7" stroke-width="3"/>
        <circle cx="126" cy="40" r="9" fill="#2e63d7"/>
        <circle cx="849" cy="40" r="9" fill="#178a7c"/>
        <path d="M244 40 L160 40" stroke="#654bb5" stroke-width="5.2" stroke-linecap="round" marker-end="url(#arrowPurpleLeft)"/>
        <path d="M731 40 L815 40" stroke="#654bb5" stroke-width="5.2" stroke-linecap="round" marker-end="url(#arrowPurpleRight)"/>
        <text x="448" y="51" text-anchor="middle" font-size="30">joint denoise</text>
      </g>
      <g transform="translate(549 431)" filter="url(#laneShadow)">
        <rect x="0" y="0" width="895" height="80" rx="14" fill="url(#laneFill)" stroke="#d8d2c7" stroke-width="3"/>
        <circle cx="126" cy="40" r="9" fill="#2e63d7"/>
        <circle cx="849" cy="40" r="9" fill="#178a7c"/>
        <text x="448" y="51" text-anchor="middle" font-size="30">decoupled denoise</text>
      </g>
      <g transform="translate(549 525)" filter="url(#laneShadow)">
        <rect x="0" y="0" width="895" height="80" rx="14" fill="url(#laneFill)" stroke="#d8d2c7" stroke-width="3"/>
        <circle cx="126" cy="40" r="9" fill="#2e63d7"/>
        <circle cx="849" cy="40" r="9" fill="#178a7c"/>
        <path d="M160 40 L244 40" stroke="#2e63d7" stroke-width="5.2" stroke-linecap="round" stroke-dasharray="14 11" marker-end="url(#arrowBlue)"/>
        <path d="M731 40 L815 40" stroke="#2e63d7" stroke-width="5.2" stroke-linecap="round" stroke-dasharray="14 11" marker-end="url(#arrowBlue)"/>
        <text x="448" y="51" text-anchor="middle" font-size="27">video_noisy_to_action</text>
      </g>
      <g transform="translate(549 619)" filter="url(#laneShadow)">
        <rect x="0" y="0" width="895" height="80" rx="14" fill="url(#laneFill)" stroke="#d8d2c7" stroke-width="3"/>
        <circle cx="126" cy="40" r="9" fill="#2e63d7"/>
        <circle cx="849" cy="40" r="9" fill="#178a7c"/>
        <path d="M244 40 L160 40" stroke="#178a7c" stroke-width="5.2" stroke-linecap="round" stroke-dasharray="14 11" marker-end="url(#arrowGreen)"/>
        <path d="M815 40 L731 40" stroke="#178a7c" stroke-width="5.2" stroke-linecap="round" stroke-dasharray="14 11" marker-end="url(#arrowGreen)"/>
        <text x="448" y="51" text-anchor="middle" font-size="26">action_noisy_to_video</text>
      </g>
      <g transform="translate(549 718)" filter="url(#laneShadow)">
        <rect x="0" y="0" width="895" height="90" rx="14" fill="url(#gjdLaneFill)" stroke="#f1bd70" stroke-width="4"/>
        <path d="M196 45 L118 45" stroke="#ef8619" stroke-width="5.8" stroke-linecap="round" marker-end="url(#arrowOrangeLeft)"/>
        <path d="M737 45 L815 45" stroke="#ef8619" stroke-width="5.8" stroke-linecap="round" marker-end="url(#arrowOrangeRight)"/>
        <text x="448" y="56" text-anchor="middle" font-size="31" fill="#7c4a12">generalist_joint_denoising</text>
      </g>
    </g>

    <!-- Bottom training recipe -->
    <path d="M271 834 L271 851 L1010 851" fill="none" stroke="#25304a" stroke-width="3"/>
    <path d="M1767 834 L1767 851 L1030 851" fill="none" stroke="#25304a" stroke-width="3"/>
    <line x1="1020" y1="851" x2="1020" y2="872" stroke="#25304a" stroke-width="3"/>
    <g transform="translate(367 885)" filter="url(#panelShadow)">
      <rect x="0" y="0" width="1302" height="101" rx="16" fill="url(#recipeFill)" stroke="#efce93" stroke-width="4"/>
      <circle cx="82" cy="50" r="40" fill="#f4ecff" stroke="#654bb5" stroke-width="4"/>
      <circle cx="68" cy="34" r="4.5" fill="#654bb5"/>
      <circle cx="101" cy="43" r="4.5" fill="#654bb5"/>
      <circle cx="67" cy="62" r="4.5" fill="#654bb5"/>
      <circle cx="98" cy="73" r="4.5" fill="#654bb5"/>
      <path d="M68 34 L101 43 L98 73 L67 62 L101 43" fill="none" stroke="#654bb5" stroke-width="4"/>
      <text x="752" y="61" text-anchor="middle" font-size="28" fill="#4b5563">Unified training recipe across all interaction programs</text>
    </g>
    <text x="1024" y="1030" text-anchor="middle" font-size="29" font-style="italic" font-weight="850">
      <tspan fill="#60a5fa">One model.</tspan>
      <tspan fill="#2dd4bf"> All interaction programs.</tspan>
      <tspan fill="#fb923c"> End-to-end training.</tspan>
    </text>
  </g>
</svg>
